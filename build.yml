          package com.example.island

          import android.content.ComponentName
          import android.content.Context
          import android.graphics.drawable.BitmapDrawable
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState

          /** Следит за активными медиасессиями (Spotify, YouTube Music и т.д.) через доступ к уведомлениям. */
          class MediaWatcher(private val ctx: Context, listener: ComponentName) {
              private val msm = ctx.getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
              private val callbacks = mutableMapOf<MediaController, MediaController.Callback>()
              private var lastTrack = ""

              private val sessionsListener = MediaSessionManager.OnActiveSessionsChangedListener { attach(it) }
              private val component = listener

              fun start() {
                  msm.addOnActiveSessionsChangedListener(sessionsListener, component)
                  attach(msm.getActiveSessions(component))
              }

              fun stop() {
                  msm.removeOnActiveSessionsChangedListener(sessionsListener)
                  callbacks.forEach { (c, cb) -> c.unregisterCallback(cb) }
                  callbacks.clear()
                  IslandBus.live(Kind.MEDIA, null)
              }

              private fun attach(list: List<MediaController>?) {
                  callbacks.forEach { (c, cb) -> c.unregisterCallback(cb) }
                  callbacks.clear()
                  list?.forEach { c ->
                      val cb = object : MediaController.Callback() {
                          override fun onPlaybackStateChanged(s: PlaybackState?) = update(c, false)
                          override fun onMetadataChanged(m: MediaMetadata?) = update(c, true)
                      }
                      c.registerCallback(cb)
                      callbacks[c] = cb
                  }
                  list?.firstOrNull()?.let { update(it, false) } ?: IslandBus.live(Kind.MEDIA, null)
              }

              private fun update(c: MediaController, trackChanged: Boolean) {
                  val playing = c.playbackState?.state == PlaybackState.STATE_PLAYING
                  val md = c.metadata
                  val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: ""
                  val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                  val bmp = md?.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART) ?: md?.getBitmap(MediaMetadata.METADATA_KEY_ART)
                  val icon = bmp?.let { BitmapDrawable(ctx.resources, it) } ?: ctx.getDrawable(android.R.drawable.ic_media_play)
                  val tc = c.transportControls
                  val acts = listOf(
                      IslandAction("⏮") { tc.skipToPrevious() },
                      IslandAction(if (playing) "⏸" else "▶") { if (playing) tc.pause() else tc.play() },
                      IslandAction("⏭") { tc.skipToNext() }
                  )
                  val e = IslandEvent(Kind.MEDIA, icon, title.ifEmpty { "Музыка" }, artist,
                      compactText = if (playing) "♪" else "❚❚", tintIcon = bmp == null, actions = acts, key = "media")
                  if (title.isEmpty()) { IslandBus.live(Kind.MEDIA, null); return }
                  IslandBus.live(Kind.MEDIA, if (playing) e else null)
                  if (trackChanged && playing && title != lastTrack) IslandBus.post(e)
                  lastTrack = title
              }
          }
          ISLAND_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/NotifListener.kt <<'ISLAND_EOF'
          package com.example.island

          import android.app.Notification
          import android.content.ComponentName
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotifListener : NotificationListenerService() {
              private var media: MediaWatcher? = null

              override fun onListenerConnected() {
                  media = MediaWatcher(this, ComponentName(this, NotifListener::class.java)).also { it.start() }
              }

              override fun onListenerDisconnected() { media?.stop(); media = null }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val n = sbn.notification
                  val isCall = n.category == Notification.CATEGORY_CALL
                  if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                  if (!isCall && n.flags and Notification.FLAG_ONGOING_EVENT != 0) return
                  if (n.category == Notification.CATEGORY_TRANSPORT) return   // медиа обрабатывает MediaWatcher
                  if (sbn.packageName == packageName) return
                  val ex = n.extras
                  val title = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val icon = runCatching { n.smallIcon?.loadDrawable(this) }.getOrNull()
                  val acts = if (isCall) n.actions?.take(2)?.map { a ->
                      IslandAction(a.title.toString()) { runCatching { a.actionIntent.send() } }
                  } ?: emptyList() else emptyList()
                  IslandBus.post(IslandEvent(
                      kind = if (isCall) Kind.CALL else Kind.NOTIFICATION,
                      icon = icon, title = title, text = text, intent = n.contentIntent,
                      actions = acts, sticky = isCall,
                      accent = if (isCall) 0xFF30D158.toInt() else 0xFFFFFFFF.toInt(),
                      key = sbn.key
                  ))
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification) { IslandBus.removed(sbn.key) }
          }
          ISLAND_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/Prefs.kt <<'ISLAND_EOF'
          package com.example.island

          import android.content.Context

          object Prefs {
              private fun sp(c: Context) = c.getSharedPreferences("island", Context.MODE_PRIVATE)
              // Положение левого края островка, dp. Подгоняется ползунками под камеру Nothing Phone (1).
              fun x(c: Context) = sp(c).getInt("x", 12)
              fun y(c: Context) = sp(c).getInt("y", 6)
              fun d(c: Context) = sp(c).getInt("d", 32)   // диаметр свёрнутой "таблетки"
              fun set(c: Context, k: String, v: Int) = sp(c).edit().putInt(k, v).apply()
          }
          ISLAND_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'ISLAND_EOF'
          <resources>
              <string name="service_desc">Рисует Dynamic Island вокруг фронтальной камеры. Данные экрана не считываются.</string>
          </resources>
          ISLAND_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'ISLAND_EOF'
